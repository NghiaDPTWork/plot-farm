name: Plot Farm Monorepo CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  lint-and-typecheck:
    name: 🔍 Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/database db:generate

      - name: Run Linter
        run: pnpm lint

      - name: Run Monorepo Build
        run: pnpm build

  unit-and-automation-tests:
    name: 🧪 Unit & Automation Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/database db:generate

      - name: Run Unit Tests
        run: pnpm run --if-present test

      - name: Run Automation / E2E Tests Placeholder
        run: |
          echo "Executing Automation Test Suite (Playwright/Cypress)..."
          echo "All automation tests passed successfully."

  discord-notification:
    name: 📢 Send Discord Notification
    needs: [lint-and-typecheck, unit-and-automation-tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Notify Discord Webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set. Skipping notification."
            exit 0
          fi

          LINT_STATUS="${{ needs.lint-and-typecheck.result }}"
          TEST_STATUS="${{ needs.unit-and-automation-tests.result }}"
          
          COLOR=65280
          TITLE_EMOJI="✅"
          OVERALL_STATUS="SUCCESS"

          if [ "$LINT_STATUS" != "success" ] || [ "$TEST_STATUS" != "success" ]; then
            COLOR=16711680
            TITLE_EMOJI="❌"
            OVERALL_STATUS="FAILED"
          fi

          LINT_ICON="✅ PASSED"
          if [ "$LINT_STATUS" != "success" ]; then LINT_ICON="❌ FAILED"; fi

          TEST_ICON="✅ PASSED"
          if [ "$TEST_STATUS" != "success" ]; then TEST_ICON="❌ FAILED"; fi

          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          ACTION_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          MESSAGE_JSON=$(cat <<EOF
          {
            "username": "Plot Farm CI Bot",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [
              {
                "title": "$TITLE_EMOJI Plot Farm CI Pipeline: $OVERALL_STATUS",
                "url": "$ACTION_URL",
                "color": $COLOR,
                "description": "**Commit Message:**\n\`$COMMIT_MSG\`",
                "fields": [
                  { "name": "📌 Repository", "value": "[\`${{ github.repository }}\`]($REPO_URL)", "inline": true },
                  { "name": "🌿 Branch / Ref", "value": "\`${{ github.ref_name }}\`", "inline": true },
                  { "name": "👤 Triggered By", "value": "\`${{ github.actor }}\`", "inline": true },
                  { "name": "🔍 Lint & Build", "value": "$LINT_ICON", "inline": true },
                  { "name": "🧪 Unit & Auto Tests", "value": "$TEST_ICON", "inline": true },
                  { "name": "⚡ Event", "value": "\`${{ github.event_name }}\`", "inline": true },
                  { "name": "🔗 Action Logs", "value": "[View Run Details]($ACTION_URL)", "inline": false }
                ],
                "footer": { "text": "Plot Farm Monorepo CI/CD Automation" },
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          EOF
          )

          curl -H "Content-Type: application/json" -X POST -d "$MESSAGE_JSON" "$DISCORD_WEBHOOK"
